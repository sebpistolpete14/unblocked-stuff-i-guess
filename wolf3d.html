    <!DOCTYPE html>
    <html>
    <head>
        <title>jsdos in HTML</title>
    </head>
    <body>
        <div id="dos-container"></div>
        <script src="https://cdn.jsdelivr.net/npm/js-dos@7.2.1/dist/js-dos.js"></script>
        <script>
            Dos(document.getElementById("dos-container")).ready(function (fs, main) {
                fs.extract(./WOLF3D.zip").then(function () {
                    main(["-c", "WOLF3D.EXE"]);
                });
            });
        </script>
    </body>
    </html>
