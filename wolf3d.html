
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Wolfenstein 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/js-dos@6.22.0/dist/js-dos.js"></script>
  <style>
    html, body, canvas, .dosbox-container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <canvas id="jsdos"></canvas>
  <script>
    Dos(document.getElementById("jsdos"), {
        wdosboxUrl: "https://cdn.jsdelivr.net/npm/js-dos@6.22.0/dist/wdosbox.js",
        cycles: 1000,
        autolock: false,
    }).ready(function (fs, main) {
      fs.extract("./WOLF3D.zip").then(function () {
        main(["-c", "WOLF3D.EXE"]).then(function (ci) {
            window.ci = ci;
        });
      });
    });
  </script>
</body>

</html>
